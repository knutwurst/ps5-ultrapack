<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1118" width="1600" height="1118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#3d8bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="1118" rx="30" fill="#0b0d12"/>

  <!-- column headers -->
  <text x="250" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7385" letter-spacing="2.5">WHAT GOES IN</text>
  <text x="800" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7385" letter-spacing="2.5">IN ONE JOB</text>
  <text x="1350" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7385" letter-spacing="2.5">WHAT COMES OUT</text>


  <!-- ========== inputs ========== -->
  <g id="in">
    <rect x="60" y="196" width="380" height="94" rx="16" fill="#12161e" stroke="#262d3a"/>
    <g transform="translate(0 39)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><path d="M91 196 h9 l4 4 h13 a2 2 0 0 1 2 2 v13 a2 2 0 0 1 -2 2 h-26 a2 2 0 0 1 -2 -2 v-17 a2 2 0 0 1 2 -2 z" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linejoin="round"/></g>
    <text x="146" y="237" font-size="21" font-weight="600" fill="#e7ebf2">Game folder</text>
    <text x="146" y="264" font-size="15" fill="#9aa3b2">A decrypted dump, or a folder of games</text>
    <rect x="60" y="310" width="380" height="94" rx="16" fill="#12161e" stroke="#262d3a"/>
    <g transform="translate(0 153)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><path d="M91 199 h26 v16 a2 2 0 0 1 -2 2 h-22 a2 2 0 0 1 -2 -2 z M89 193 h30 v6 h-30 z M101 205 h6" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text x="146" y="351" font-size="21" font-weight="600" fill="#e7ebf2">Archive</text>
    <text x="146" y="378" font-size="15" fill="#9aa3b2">ZIP, RAR, 7z · multi-part sets, passwords</text>
    <rect x="60" y="424" width="380" height="94" rx="16" fill="#12161e" stroke="#262d3a"/>
    <g transform="translate(0 267)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><ellipse cx="104" cy="193" rx="12" ry="4.5" fill="none" stroke="#7ab0ff" stroke-width="2"/><path d="M92 193 v16 c0 2.5 5.4 4.5 12 4.5 s12 -2 12 -4.5 v-16 M92 201 c0 2.5 5.4 4.5 12 4.5 s12 -2 12 -4.5" fill="none" stroke="#7ab0ff" stroke-width="2"/></g>
    <text x="146" y="465" font-size="21" font-weight="600" fill="#e7ebf2">Disk image</text>
    <text x="146" y="492" font-size="15" fill="#9aa3b2">.exfat, .ffpkg</text>
    <rect x="60" y="538" width="380" height="94" rx="16" fill="#12161e" stroke="#262d3a"/>
    <g transform="translate(0 381)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><path d="M94 193 h13 l7 7 v18 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 v-23 a2 2 0 0 1 2 -2 z M107 193 v7 h7 M98 210 h12 M98 215 h12" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text x="146" y="579" font-size="21" font-weight="600" fill="#e7ebf2">Container</text>
    <text x="146" y="606" font-size="15" fill="#9aa3b2">.ffpfs, .ffpfsc</text>
    <rect x="60" y="652" width="380" height="94" rx="16" fill="#12161e" stroke="#262d3a"/>
    <g transform="translate(0 495)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><path d="M104 192 l13 6.5 v13 l-13 6.5 l-13 -6.5 v-13 z M91 198.5 l13 6.5 l13 -6.5 M104 205 v13" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
    <text x="146" y="693" font-size="21" font-weight="600" fill="#e7ebf2">Package</text>
    <text x="146" y="720" font-size="15" fill="#9aa3b2">PS5 fPKG, PS4 game, update and DLC</text>
    <g fill="none" stroke="#3d8bff" stroke-width="2.5" stroke-linecap="round">
      <path d="M440 243 h30 M440 357 h30 M440 471 h30 M440 585 h30 M440 699 h30"/>
      <path d="M470 243 v456"/>
      <path d="M470 471 h66" marker-end="url(#ah)"/>
    </g>
  </g>

  <!-- ========== processing ========== -->
  <g id="do">
    <rect x="540" y="112" width="520" height="718" rx="22" fill="#12161e" stroke="#3a4354"/>
    <text x="800" y="158" text-anchor="middle" font-size="27" font-weight="700" fill="#e7ebf2">PS5 UltraPack</text>
    <text x="800" y="184" text-anchor="middle" font-size="14" fill="#9aa3b2">One queue · each job runs these steps in this order</text>
    <path d="M602 236 v490" fill="none" stroke="#262d3a" stroke-width="2"/>
    <circle cx="602" cy="236" r="15" fill="#1f6feb"/>
    <text x="602" y="241" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="634" y="232" font-size="19" font-weight="600" fill="#e7ebf2">Read and unpack</text>
    <text x="634" y="254" font-size="14" fill="#9aa3b2">Title, version and SDK from the game itself; archives extracted</text>
    <circle cx="602" cy="306" r="15" fill="#3a2412" stroke="#f0883e" stroke-width="2"/>
    <text x="602" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e">2</text>
    <text x="634" y="302" font-size="19" font-weight="600" fill="#e7ebf2">Integrate a patch</text>
    <rect x="812" y="286" width="70" height="22" rx="11" fill="#3a2412"/>
    <text x="847" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">optional</text>
    <text x="634" y="324" font-size="14" fill="#9aa3b2">An update or backport files; every replaced file is kept</text>
    <circle cx="602" cy="376" r="15" fill="#3a2412" stroke="#f0883e" stroke-width="2"/>
    <text x="602" y="381" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e">3</text>
    <text x="634" y="372" font-size="19" font-weight="600" fill="#e7ebf2">Backport to an older firmware</text>
    <rect x="922" y="356" width="70" height="22" rx="11" fill="#3a2412"/>
    <text x="957" y="371" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">optional</text>
    <text x="634" y="394" font-size="14" fill="#9aa3b2">7.61, 6.02, 10.xx: SDK lowered, imports checked first</text>
    <circle cx="602" cy="446" r="15" fill="#3a2412" stroke="#f0883e" stroke-width="2"/>
    <text x="602" y="451" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e">4</text>
    <text x="634" y="442" font-size="19" font-weight="600" fill="#e7ebf2">Sign</text>
    <rect x="690" y="426" width="70" height="22" rx="11" fill="#3a2412"/>
    <text x="725" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">optional</text>
    <text x="634" y="464" font-size="14" fill="#9aa3b2">Executables fake-signed in place</text>
    <circle cx="602" cy="516" r="15" fill="#3a2412" stroke="#f0883e" stroke-width="2"/>
    <text x="602" y="521" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e">5</text>
    <text x="634" y="512" font-size="19" font-weight="600" fill="#e7ebf2">LZ4 asset packs</text>
    <rect x="798" y="496" width="70" height="22" rx="11" fill="#3a2412"/>
    <text x="833" y="511" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">optional</text>
    <text x="634" y="534" font-size="14" fill="#9aa3b2">AMPR games about half the size, read by ampr_emu</text>
    <circle cx="602" cy="586" r="15" fill="#1f6feb"/>
    <text x="602" y="591" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
    <text x="634" y="582" font-size="19" font-weight="600" fill="#e7ebf2">Build</text>
    <text x="634" y="604" font-size="14" fill="#9aa3b2">64 KiB PFS images, Kraken .pkg, PlayGo kept, AMPR index</text>
    <circle cx="602" cy="656" r="15" fill="#1f6feb"/>
    <text x="602" y="661" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
    <text x="634" y="652" font-size="19" font-weight="600" fill="#e7ebf2">Clean and name</text>
    <text x="634" y="674" font-size="14" fill="#9aa3b2">OS clutter out, add-ons sorted to their game, named</text>
    <circle cx="602" cy="726" r="15" fill="#1f6feb"/>
    <text x="602" y="731" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">8</text>
    <text x="634" y="722" font-size="19" font-weight="600" fill="#e7ebf2">After the job</text>
    <text x="634" y="744" font-size="14" fill="#9aa3b2">Keep, move or trash the source; sleep when the queue is done</text>
    <line x1="564" y1="770" x2="1036" y2="770" stroke="#262d3a"/>
    <text x="800" y="792" text-anchor="middle" font-size="14" fill="#9aa3b2">Pause and reorder the queue  ·  English and German, light and dark</text>
    <text x="800" y="812" text-anchor="middle" font-size="14" fill="#9aa3b2">Every build spread across your SSD and hard disks</text>
    <path d="M1060 471 h66" fill="none" stroke="#3d8bff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
  </g>

  <!-- ========== outputs ========== -->
  <g id="out">
    <g fill="none" stroke="#3d8bff" stroke-width="2.5" stroke-linecap="round">
      <path d="M1130 161 v620"/>
      <path d="M1130 161 h30 M1130 285 h30 M1130 409 h30 M1130 533 h30 M1130 657 h30 M1130 781 h30"/>
    </g>
    <rect x="1160" y="112" width="380" height="98" rx="16" fill="#12161e" stroke="#262d3a"/>
    <text x="1186" y="148" font-size="24" font-weight="700" fill="#7ab0ff">.ffpfsc</text>
    <text x="1186" y="173" font-size="15" fill="#e7ebf2">Compressed container</text>
    <text x="1186" y="194" font-size="14" fill="#9aa3b2">Level 1 to 9, for ShadowMountPlus</text>
    <rect x="1160" y="236" width="380" height="98" rx="16" fill="#12161e" stroke="#262d3a"/>
    <text x="1186" y="272" font-size="24" font-weight="700" fill="#7ab0ff">.ffpfs</text>
    <text x="1186" y="297" font-size="15" fill="#e7ebf2">Uncompressed image</text>
    <text x="1186" y="318" font-size="14" fill="#9aa3b2">Full size, mounts fast</text>
    <rect x="1160" y="360" width="380" height="98" rx="16" fill="#12161e" stroke="#262d3a"/>
    <text x="1186" y="396" font-size="24" font-weight="700" fill="#7ab0ff">.exfat</text>
    <text x="1186" y="421" font-size="15" fill="#e7ebf2">exFAT image, 64 KiB clusters</text>
    <text x="1186" y="442" font-size="14" fill="#9aa3b2">Read fastest from USB</text>
    <rect x="1160" y="484" width="380" height="98" rx="16" fill="#12161e" stroke="#262d3a"/>
    <text x="1186" y="520" font-size="24" font-weight="700" fill="#7ab0ff">.pkg</text>
    <text x="1186" y="545" font-size="15" fill="#e7ebf2">Installable fake package</text>
    <circle cx="1192" cy="562" r="4.5" fill="#3fb950"/>
    <text x="1204" y="566" font-size="14" fill="#9aa3b2">Launches on a retail PS5, firmware 11.60</text>
    <rect x="1160" y="608" width="380" height="98" rx="16" fill="#12161e" stroke="#262d3a"/>
    <text x="1186" y="644" font-size="24" font-weight="700" fill="#7ab0ff">Folder</text>
    <text x="1186" y="669" font-size="15" fill="#e7ebf2">The unpacked /app0 tree</text>
    <text x="1186" y="690" font-size="14" fill="#9aa3b2">From any container or package</text>
    <rect x="1160" y="732" width="380" height="98" rx="16" fill="#12161e" stroke="#262d3a"/>
    <text x="1186" y="768" font-size="24" font-weight="700" fill="#7ab0ff">Organize</text>
    <text x="1186" y="793" font-size="15" fill="#e7ebf2">Into your library as it is</text>
    <text x="1186" y="814" font-size="14" fill="#9aa3b2">PS4 packages sorted with UPDATE and DLC</text>
  </g>

  <!-- ========== tools ========== -->
  <text x="800" y="882" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7385" letter-spacing="2.5">TOOLS</text>
  <rect x="61" y="904" width="350" height="96" rx="16" fill="#12161e" stroke="#262d3a"/>
  <g transform="translate(1 748)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><circle cx="101" cy="201" r="8" fill="none" stroke="#7ab0ff" stroke-width="2"/><path d="M107 207 l9 9" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linecap="round"/></g>
  <text x="147" y="942" font-size="19" font-weight="600" fill="#e7ebf2">Look inside</text>
  <text x="147" y="965" font-size="14" fill="#9aa3b2">Browse an image or package,</text>
  <text x="147" y="983" font-size="14" fill="#9aa3b2">pull single files out</text>
  <rect x="437" y="904" width="350" height="96" rx="16" fill="#12161e" stroke="#262d3a"/>
  <g transform="translate(377 748)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><path d="M91 196 h9 l4 4 h13 a2 2 0 0 1 2 2 v13 a2 2 0 0 1 -2 2 h-26 a2 2 0 0 1 -2 -2 v-17 a2 2 0 0 1 2 -2 z" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linejoin="round"/></g>
  <text x="523" y="942" font-size="19" font-weight="600" fill="#e7ebf2">Organize</text>
  <text x="523" y="965" font-size="14" fill="#9aa3b2">Name and sort a library</text>
  <text x="523" y="983" font-size="14" fill="#9aa3b2">in place, with undo</text>
  <rect x="813" y="904" width="350" height="96" rx="16" fill="#12161e" stroke="#262d3a"/>
  <g transform="translate(753 748)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><circle cx="97" cy="210" r="6" fill="none" stroke="#7ab0ff" stroke-width="2"/><path d="M101.5 205.5 l12 -12 M109 198 l4 4 M112.5 194.5 l3.5 3.5" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linecap="round"/></g>
  <text x="899" y="942" font-size="19" font-weight="600" fill="#e7ebf2">PS4 repair</text>
  <text x="899" y="965" font-size="14" fill="#9aa3b2">Keystone from a save, version,</text>
  <text x="899" y="983" font-size="14" fill="#9aa3b2">updates bound to the game</text>
  <rect x="1189" y="904" width="350" height="96" rx="16" fill="#12161e" stroke="#262d3a"/>
  <g transform="translate(1129 748)"><rect x="80" y="180" width="48" height="48" rx="12" fill="#16294a"/><path d="M104 191 l12 4.5 v8 c0 7.5 -5.2 12.5 -12 14.5 c-6.8 -2 -12 -7 -12 -14.5 v-8 z M98.5 204 l4 4 l7.5 -8" fill="none" stroke="#7ab0ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
  <text x="1275" y="942" font-size="19" font-weight="600" fill="#e7ebf2">PS5 repair</text>
  <text x="1275" y="965" font-size="14" fill="#9aa3b2">Checks, keystone, trophies,</text>
  <text x="1275" y="983" font-size="14" fill="#9aa3b2">AMPR index, firmware</text>

  <!-- footer -->
  <line x1="60" y1="1030" x2="1540" y2="1030" stroke="#262d3a"/>
  <text x="800" y="1066" text-anchor="middle" font-size="15" fill="#9aa3b2">Every result named from the game's own metadata:</text>
  <text x="800" y="1090" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#e7ebf2">Title [PPSA00000] [v01.200] [fw7.61].ffpfsc</text>
</svg>
